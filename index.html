  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:#8A857A;margin-bottom:28px;\">AI ENGINEERING STUDENT — CANBERRA, AUSTRALIA<\u002Fdiv>\n      <h1 style=\"font-weight:500;font-size:clamp(42px,6.2vw,80px);line-height:1.02;letter-spacing:-.04em;margin:0 0 34px;\">Building AI systems from raw data to <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#2440C8;\">working&nbsp;apps.<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:17px;line-height:1.65;max-width:46ch;margin:0 0 12px;color:#3D3A33;text-wrap:pretty;\">Student building AI projects end to end — from cleaning the data to shipping a working app. Learning in public, one repo at a time.<\u002Fp>\n      <p style=\"font-size:14.5px;line-height:1.65;max-width:48ch;margin:0 0 40px;color:#8A857A;\">Three shipped projects, three different architectures, all running on local AI models on an 8&nbsp;GB laptop.<\u002Fp>\n      <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap;\">\n        <a ref=\"{{ magRef }}\" href=\"#projects\" style=\"display:inline-block;background:#141310;color:#F2EFE9;font-size:14.5px;font-weight:500;padding:14px 26px;border-radius:999px;will-change:transform;\" style-hover=\"background:#2440C8;color:#F2EFE9;\">See the work ↓<\u002Fa>\n        <a href=\"mailto:Jacobpakkiyaretnam@gmail.com\" style=\"font-size:14.5px;font-weight:500;border-bottom:1.5px solid #141310;padding-bottom:3px;\" style-hover=\"color:#2440C8;border-bottom:1.5px solid #2440C8;\">Email me<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STICKER BOARD (static) -->\n    <div class=\"board\" style=\"position:relative;min-height:480px;height:100%;border:1.5px dashed #C9C3B4;border-radius:20px;overflow:hidden;\" data-screen-label=\"Sticker board\">\n      <div data-sticker=\"0\" style=\"position:absolute;left:8%;top:12%;width:max-content;white-space:nowrap;background:#FFFFFF;border:1.5px solid #141310;border-radius:12px;padding:12px 16px;box-shadow:3px 4px 0 #141310;transform:rotate(-5deg);transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(-2deg) translateY(-6px) scale(1.05);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2440C8;\">▸ CLI<\u002Fdiv>\n        <div style=\"font-weight:700;font-size:15px;\">local-rag<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-sticker=\"1\" style=\"position:absolute;left:38%;top:28%;width:max-content;white-space:nowrap;background:#2440C8;color:#F2EFE9;border-radius:12px;padding:12px 16px;box-shadow:3px 4px 0 #141310;transform:rotate(4deg);transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(1deg) translateY(-6px) scale(1.05);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;\">▸ WEB APP<\u002Fdiv>\n        <div style=\"font-weight:700;font-size:15px;\">meeting-summarizer<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-sticker=\"2\" style=\"position:absolute;left:6%;top:48%;width:max-content;white-space:nowrap;background:#FFFFFF;border:1.5px solid #141310;border-radius:12px;padding:12px 16px;box-shadow:3px 4px 0 #141310;transform:rotate(2deg);transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(-1deg) translateY(-6px) scale(1.05);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2440C8;\">▸ HEADLESS API<\u002Fdiv>\n        <div style=\"font-weight:700;font-size:15px;\">company-enrichment-api<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-sticker=\"3\" style=\"position:absolute;left:40%;top:70%;width:max-content;white-space:nowrap;background:#141310;color:#F2EFE9;border-radius:999px;padding:10px 18px;transform:rotate(-7deg);font-family:'IBM Plex Mono',monospace;font-size:12px;transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(-3deg) translateY(-6px);\">8 GB LAPTOP · NO CLOUD<\u002Fdiv>\n      <div data-sticker=\"4\" style=\"position:absolute;left:8%;top:84%;width:max-content;white-space:nowrap;background:#FFDF3E;border:1.5px solid #141310;border-radius:999px;padding:10px 18px;transform:rotate(5deg);font-weight:700;font-size:13px;transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(2deg) translateY(-6px);\">Canberra, AU 🇦🇺<\u002Fdiv>\n      <div data-sticker=\"5\" style=\"position:absolute;left:66%;top:8%;transform:rotate(8deg);transition:transform .3s cubic-bezier(.22,1,.36,1);\" style-hover=\"transform:rotate(3deg) translateY(-6px) scale(1.06);\">\n        <svg width=\"86\" height=\"92\" sc-camel-view-box=\"0 0 86 92\" aria-label=\"Robot sticker\">\n          <line x1=\"43\" y1=\"6\" x2=\"43\" y2=\"16\" stroke=\"#141310\" stroke-width=\"2.5\"><\u002Fline>\n          <circle cx=\"43\" cy=\"6\" r=\"4\" fill=\"#2440C8\" stroke=\"#141310\" stroke-width=\"1.5\"><\u002Fcircle>\n          <rect x=\"13\" y=\"16\" width=\"60\" height=\"44\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#141310\" stroke-width=\"2.5\"><\u002Frect>\n          <rect x=\"23\" y=\"27\" width=\"40\" height=\"20\" rx=\"9\" fill=\"#141310\"><\u002Frect>\n          <circle cx=\"35\" cy=\"37\" r=\"4\" fill=\"#FFDF3E\"><\u002Fcircle>\n          <circle cx=\"51\" cy=\"37\" r=\"4\" fill=\"#FFDF3E\"><\u002Fcircle>\n          <rect x=\"25\" y=\"62\" width=\"36\" height=\"24\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#141310\" stroke-width=\"2.5\"><\u002Frect>\n          <path d=\"M36 74 q7 5 14 0\" stroke=\"#141310\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- MARQUEE -->\n  <div style=\"border-top:1.5px solid #141310;border-bottom:1.5px solid #141310;overflow:hidden;background:#F2EFE9;\" data-screen-label=\"Marquee\">\n    <div style=\"display:flex;width:max-content;animation:marquee 22s linear infinite;padding:12px 0;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.12em;color:#141310;white-space:nowrap;\">\n      <span style=\"padding-right:28px;\">THREE SHIPPED PROJECTS ✺ THREE ARCHITECTURES ✺ LOCAL MODELS ONLY ✺ 8 GB LAPTOP ✺ LEARNING IN PUBLIC ✺ UNI INTAKE 2028 ✺&nbsp;<\u002Fspan>\n      <span style=\"padding-right:28px;\">THREE SHIPPED PROJECTS ✺ THREE ARCHITECTURES ✺ LOCAL MODELS ONLY ✺ 8 GB LAPTOP ✺ LEARNING IN PUBLIC ✺ UNI INTAKE 2028 ✺&nbsp;<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PROJECTS -->\n  <section id=\"projects\" style=\"max-width:1280px;margin:0 auto;padding:90px 40px 40px;box-sizing:border-box;\" data-screen-label=\"Projects\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:#8A857A;margin-bottom:10px;\">01 — SELECTED WORK<\u002Fdiv>\n    <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"3\">\n      <a href=\"{{ p.link }}\" class=\"proj-grid\" data-cursor=\"OPEN\" data-reveal=\"\" style=\"display:grid;grid-template-columns:64px 1fr .85fr 48px;gap:24px;align-items:baseline;padding:38px 18px;margin:0 -18px;border-top:1.5px solid #141310;color:inherit;border-radius:14px;transition:background .25s,color .25s;\" style-hover=\"background:#141310;color:#F2EFE9;text-decoration:none;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.5;\">{{ p.num }}<\u002Fspan>\n        <span style=\"font-weight:500;font-size:clamp(26px,3.8vw,46px);letter-spacing:-.03em;line-height:1.05;\">{{ p.name }}<\u002Fspan>\n        <span style=\"display:block;\">\n          <span style=\"display:block;font-size:14px;line-height:1.6;opacity:.75;text-wrap:pretty;\">{{ p.line }}<\u002Fspan>\n          <span style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;opacity:.5;margin-top:8px;\">{{ p.stack }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:20px;\">↗<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsc-for>\n    <div style=\"border-top:1.5px solid #141310;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABOUT -->\n  <section id=\"about\" style=\"max-width:1280px;margin:0 auto;padding:70px 40px;box-sizing:border-box;\" data-screen-label=\"About\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:#8A857A;margin-bottom:36px;\">02 — WHAT BUILDING THESE TAUGHT ME<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px;\">\n      <div data-reveal=\"\" style=\"background:#FFFFFF;border:1.5px solid #141310;border-radius:16px;padding:26px;box-shadow:4px 5px 0 #141310;\">\n        <div style=\"font-weight:700;font-size:20px;letter-spacing:-.02em;margin-bottom:12px;\">Constraints shape architecture.<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#3D3A33;text-wrap:pretty;\">Everything had to run on an 8 GB laptop with no cloud APIs, so model choice and design followed the hardware.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFFFFF;border:1.5px solid #141310;border-radius:16px;padding:26px;box-shadow:4px 5px 0 #141310;\">\n        <div style=\"font-weight:700;font-size:20px;letter-spacing:-.02em;margin-bottom:12px;\">Fluent can still be wrong — two ways.<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#3D3A33;text-wrap:pretty;\">Stating something false, or adding plausible details that were never in the source. Learning to test for the second one changed how I evaluate outputs.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFFFFF;border:1.5px solid #141310;border-radius:16px;padding:26px;box-shadow:4px 5px 0 #141310;\">\n        <div style=\"font-weight:700;font-size:20px;letter-spacing:-.02em;margin-bottom:12px;\">Three architectures, on purpose.<\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:#3D3A33;text-wrap:pretty;\">A CLI, a web app and a headless API each teach a different pattern for how software gets used.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border-top:1.5px solid #141310;\">\n      <sc-for list=\"{{ creds }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <a href=\"{{ c.href }}\" sc-camel-on-click=\"{{ c.onOpen }}\" data-cursor=\"VIEW\" data-reveal=\"\" style=\"display:block;padding:22px 20px 22px 0;border-bottom:1px solid #C9C3B4;color:inherit;\" style-hover=\"color:#2440C8;text-decoration:none;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#2440C8;margin-bottom:6px;\">{{ c.year }} · {{ c.kind }}<\u002Fdiv>\n          <div style=\"font-weight:700;font-size:15.5px;\">{{ c.title }} <span style=\"font-size:13px;\">↗<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#8A857A;margin-top:4px;\">{{ c.sub }}<\u002Fdiv>\n          <sc-if value=\"{{ c.img }}\" hint-placeholder-val=\"{{ false }}\">\n            {{ c.thumb }}\n            <span style=\"display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:#B5AF9F;margin-top:8px;\">CLICK TO ENLARGE<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ c.logo }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"display:flex;align-items:center;justify-content:center;max-width:260px;margin-top:14px;border:1.5px solid #141310;border-radius:10px;box-shadow:3px 4px 0 #141310;overflow:hidden;background:#000000;height:120px;\">\n              <img src=\"d520be2a-b96b-48fe-8bb2-de97e7143694\" alt=\"Bluerydge logo\" style=\"max-height:100%;max-width:100%;object-fit:contain;\">\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" style=\"background:#141310;color:#F2EFE9;margin-top:40px;\" data-screen-label=\"Contact\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:100px 40px 40px;box-sizing:border-box;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:#807B6F;margin-bottom:28px;\">03 — CONTACT<\u002Fdiv>\n      <h2 style=\"font-weight:500;font-size:clamp(34px,5.4vw,68px);letter-spacing:-.035em;line-height:1.05;margin:0 0 30px;max-width:20ch;text-wrap:pretty;\">Studying software engineering &amp; AI from <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#FFDF3E;\">2028.<\u002Fspan><\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.7;color:#B5AF9F;max-width:48ch;margin:0 0 44px;text-wrap:pretty;\">Open to part-time or cadetship roles in Canberra alongside study.<\u002Fp>\n      <div style=\"display:flex;gap:18px;flex-wrap:wrap;align-items:center;\">\n        <a href=\"mailto:Jacobpakkiyaretnam@gmail.com\" style=\"display:inline-block;background:#F2EFE9;color:#141310;font-size:15px;font-weight:700;padding:16px 30px;border-radius:999px;\" style-hover=\"background:#FFDF3E;color:#141310;\">Jacobpakkiyaretnam@gmail.com<\u002Fa>\n        <a href=\"https://github.com/Jacob18299\" style=\"color:#F2EFE9;font-size:15px;border-bottom:1.5px solid #55524A;padding-bottom:3px;\" style-hover=\"color:#FFDF3E;border-bottom:1.5px solid #FFDF3E;\">github.com/Jacob18299 ↗<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#55524A;margin-top:110px;padding-top:24px;border-top:1px solid #2A2823;\">\n        <span>© 2026 JACOB PAKKIYARETNAM<\u002Fspan>\n        <span>MADE ON AN 8 GB LAPTOP<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.magRef = React.createRef();\n    this.state = {lightbox: null};\n  }\n  componentDidMount() {\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const lerp = (a, b, k) => a + (b - a) * k;\n    this.onMoveW = (e) => { this.mouse = {x: e.clientX, y: e.clientY}; };\n    window.addEventListener(\"pointermove\", this.onMoveW);\n    if (!reduce) {\n      const tick = () => {\n        this.raf = requestAnimationFrame(tick);\n        const m = this.magRef.current;\n        if (m && this.mouse) {\n          const mr = m.getBoundingClientRect();\n          const dxm = this.mouse.x - (mr.left + mr.width / 2), dym = this.mouse.y - (mr.top + mr.height / 2);\n          const dist = Math.hypot(dxm, dym);\n          const pull = dist < 120 ? (1 - dist / 120) * 0.35 : 0;\n          this.mx = lerp(this.mx || 0, dxm * pull, 0.2);\n          this.my = lerp(this.my || 0, dym * pull, 0.2);\n          m.style.transform = \"translate(\" + this.mx + \"px,\" + this.my + \"px)\";\n        }\n      };\n      this.raf = requestAnimationFrame(tick);\n    }\n    // scroll reveals\n    const items = document.querySelectorAll(\"[data-reveal]\");\n    if (reduce) return;\n    items.forEach(el => {\n      el.style.opacity = \"0\"; el.style.transform = \"translateY(22px)\";\n      el.style.transition = \"opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1)\";\n    });\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(en => {\n        if (en.isIntersecting) {\n          en.target.style.opacity = \"1\";\n          en.target.style.transform = \"translateY(0)\";\n          this.io.unobserve(en.target);\n        }\n      });\n    }, {threshold: 0.15});\n    items.forEach(el => this.io.observe(el));\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    if (this.io) this.io.disconnect();\n    window.removeEventListener(\"pointermove\", this.onMoveW);\n  }\n  renderVals() {\n    const openImg = (img) => (e) => { e.preventDefault(); this.setState({lightbox: img}); };\n    const thumb = (src, title) => React.createElement(\"img\", {src, alt: title + \" certificate\",\n      style: {display: \"block\", width: \"100%\", maxWidth: \"260px\", marginTop: \"14px\", border: \"1.5px solid #141310\", borderRadius: \"10px\", boxShadow: \"3px 4px 0 #141310\"}});\n    return {\n      magRef: this.magRef,\n      lightbox: this.state.lightbox,\n      lightboxImg: this.state.lightbox ? React.createElement(\"img\", {src: this.state.lightbox, alt: \"Certificate\",\n        style: {maxWidth: \"min(100%,980px)\", maxHeight: \"100%\", borderRadius: \"12px\", boxShadow: \"0 30px 80px rgba(0,0,0,.5)\"}}) : null,\n      closeLightbox: () => this.setState({lightbox: null}),\n      projects: [\n        {num: \"001\", name: \"local-rag\", link: \"https://github.com/Jacob18299/local-rag\",\n         line: \"Command-line tool — ask questions about a folder of documents and get answers with citations, grounded in the source text via chunking, embeddings and cosine-similarity ranking.\",\n         stack: \"PYTHON · OLLAMA · NOMIC-EMBED-TEXT · LLAMA3.2\"},\n        {num: \"002\", name: \"meeting-summarizer\", link: \"https://github.com/Jacob18299/meeting-summarizer\",\n         line: \"Web app — paste a meeting transcript in the browser and get a summary, decisions and action items. Flask backend with a /api/summarize endpoint, plain HTML/JS frontend.\",\n         stack: \"PYTHON · FLASK · HTML/CSS/JS · OLLAMA\"},\n        {num: \"003\", name: \"company-enrichment-api\", link: \"https://github.com/Jacob18299/company-enrichment-api\",\n         line: \"Headless API — give it a company name and it returns structured facts from Wikipedia as a typed response, with auto-generated interactive docs at /docs.\",\n         stack: \"PYTHON · FASTAPI · PYDANTIC · UVICORN\"}\n      ],\n      creds: [\n        {year: \"2026\", kind: \"WORK PLACEMENT\", title: \"AI engineering — Bluerydge\", sub: \"Canberra AI and cyber security company\", href: \"https://bluerydge.com\", logo: true},\n        {year: \"2026\", kind: \"CERTIFICATE\", title: \"Hugging Face LLM Course\", sub: \"Fundamentals of LLMs\", href: window.__resources.llmCert, img: true, thumb: thumb(window.__resources.llmCert, \"Hugging Face LLM Course\"), onOpen: openImg(window.__resources.llmCert)},\n        {year: \"2026\", kind: \"CERTIFICATE\", title: \"Hugging Face Agents Course\", sub: \"Foundations of Agents\", href: window.__resources.agentsCert, img: true, thumb: thumb(window.__resources.agentsCert, \"Hugging Face Agents Course\"), onOpen: openImg(window.__resources.agentsCert)}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
